<!DOCTYPE html>
<html>
<head>
<title>XLaunch</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
html,body{margin:0;background:#000;color:#E7E9EA;font-family:TwitterChirp,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
a{color:#8ECDFF;text-decoration:none}a:hover{text-decoration:underline;color:#8ECDFF}
input,button{font-family:inherit}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scrollbar-gutter:stable}
.top-bar{position:sticky;top:0;z-index:50;background:#000}
@media (max-width:900px){.top-nav{display:none !important}}
.glass,.glass-card,.glass-input{position:relative}
.glass{background:rgba(255,255,255,.03);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:inset 0 1px 0 rgba(255,255,255,.12)}
.glass-card{background:rgba(255,255,255,.02);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.glass-input{background:rgba(0,0,0,.5)}
.glass::before,.glass-card::before,.glass-input::before{content:'';position:absolute;inset:0;border-radius:inherit;padding:1px;background:rgba(190,225,255,.85);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);mask-composite:exclude;pointer-events:none;box-shadow:0 0 6px rgba(142,205,255,.55),inset 0 0 6px rgba(142,205,255,.35)}
.glass-input:focus-within::before{background:#8ECDFF}
.glass-input.is-error::before{background:#F4212E}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes breathe{0%,100%{filter:drop-shadow(0 0 22px rgba(142,205,255,.35)) drop-shadow(0 0 60px rgba(29,155,240,.25))}50%{filter:drop-shadow(0 0 34px rgba(142,205,255,.55)) drop-shadow(0 0 90px rgba(29,155,240,.4))}}
</style>
</helmet>
<div data-screen-label="Landing" onMouseMove="{{ onMove }}" onMouseLeave="{{ onLeave }}" style="position:relative;height:100vh;min-height:640px;background:#000;overflow:hidden">
  <canvas ref="{{ canvasRef }}" style="position:absolute;inset:0;width:100%;height:100%;pointer-events:none"></canvas>
  <div style="position:absolute;inset:0;z-index:1;pointer-events:none">
    <sc-for list="{{ orbs }}" as="o" hint-placeholder-count="8">
      <div style="position:absolute;left:{{ o.left }};right:{{ o.right }};top:{{ o.top }};animation:bob {{ o.dur }} ease-in-out infinite;animation-delay:{{ o.delay }};pointer-events:auto" onMouseEnter="{{ o.enter }}" onMouseLeave="{{ o.leave }}">
        <div class="glass" style="display:flex;flex-direction:{{ o.dir }};align-items:center;gap:10px;height:{{ o.size }};padding:{{ o.pad }};border-radius:9999px;background:rgba(0,0,0,.55);opacity:{{ o.opacity }};transform:scale({{ o.scale }});transition:opacity .35s,transform .35s,padding .35s;cursor:pointer">
          <span style="width:{{ o.av }};height:{{ o.av }};border-radius:50%;background-color:rgba(142,205,255,.12);background-image:{{ o.avatarBg }};background-size:cover;background-position:center;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;color:#E7E9EA;flex:none">{{ o.initialShown }}</span>
          <sc-if value="{{ o.open }}" hint-placeholder-val="{{ false }}">
            <span style="display:flex;flex-direction:column;line-height:1.15;padding:{{ o.textPad }};white-space:nowrap"><span style="font-size:14px;font-weight:800;color:#E7E9EA;display:flex;align-items:center;gap:4px">{{ o.name }}<svg viewBox="0 0 24 24" width="14" height="14" fill="#8ECDFF"><path d="M22.5 12.5c0-1.58-.875-2.95-2.148-3.6.154-.435.238-.905.238-1.4 0-2.21-1.71-3.998-3.818-3.998-.47 0-.92.084-1.336.25C14.818 2.415 13.51 1.5 12 1.5s-2.816.917-3.437 2.25c-.415-.165-.866-.25-1.336-.25-2.11 0-3.818 1.79-3.818 4 0 .494.083.964.237 1.4-1.272.65-2.147 2.018-2.147 3.6 0 1.495.782 2.798 1.942 3.486-.02.17-.032.34-.032.514 0 2.21 1.708 4 3.818 4 .47 0 .92-.086 1.335-.25.62 1.334 1.926 2.25 3.437 2.25 1.512 0 2.818-.916 3.437-2.25.415.163.865.248 1.336.248 2.11 0 3.818-1.79 3.818-4 0-.174-.012-.344-.033-.513 1.158-.687 1.943-1.99 1.943-3.484zm-6.616-3.334l-4.334 6.5c-.145.217-.382.334-.625.334-.143 0-.288-.04-.416-.126l-.115-.094-2.415-2.415c-.293-.293-.293-.768 0-1.06s.768-.294 1.06 0l1.77 1.767 3.825-5.74c.23-.345.696-.436 1.04-.207.346.23.44.696.21 1.04z"></path></svg></span><span style="font-size:12px;font-weight:700;color:#8B98A5">@{{ o.handle }}</span></span>
          </sc-if>
        </div>
      </div>
    </sc-for>
  </div>

  <div style="position:relative;z-index:2;height:100%;display:flex;flex-direction:column;max-width:1440px;margin:0 auto;padding:0 28px">
  <div style="display:grid;grid-template-columns:1fr auto 1fr;align-items:center;height:64px;gap:16px;flex:none">
    <a href="/" style="display:flex;align-items:center;gap:10px;color:#E7E9EA;text-decoration:none;justify-self:start" style-hover="text-decoration:none">
      <img src="/logo-glass.png" alt="" style="width:40px;height:40px;display:block;object-fit:contain">
      <span style="font-size:20px;font-weight:800;letter-spacing:-0.3px;white-space:nowrap">XLaunch</span>
    </a>
    <nav class="glass top-nav" style="display:flex;align-items:center;gap:4px;height:44px;padding:0 6px;border:0;border-radius:9999px;box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 0 24px rgba(29,155,240,.08)">
      <a href="/deploy" style="display:flex;align-items:center;height:34px;padding:0 16px;border-radius:9999px;color:#8B98A5;font-size:14px;font-weight:700;text-decoration:none;white-space:nowrap" style-hover="background:rgba(142,205,255,.10);color:#E7E9EA;text-decoration:none">Deploy</a>
      <a href="/explore" style="display:flex;align-items:center;height:34px;padding:0 16px;border-radius:9999px;color:#8B98A5;font-size:14px;font-weight:700;text-decoration:none;white-space:nowrap" style-hover="background:rgba(142,205,255,.10);color:#E7E9EA;text-decoration:none">Explore</a>
      <a href="/how-it-works" style="display:flex;align-items:center;height:34px;padding:0 16px;border-radius:9999px;color:#8B98A5;font-size:14px;font-weight:700;text-decoration:none;white-space:nowrap" style-hover="background:rgba(142,205,255,.10);color:#E7E9EA;text-decoration:none">How It Works</a>
    </nav>
    <div style="display:flex;align-items:center;gap:8px;justify-self:end">
      <sc-if value="{{ hasXProfile }}" hint-placeholder-val="{{ true }}">
        <a href="{{ xProfileUrl }}" target="_blank" rel="noopener noreferrer" title="Open on X" aria-label="Open on X" class="glass" style="width:40px;height:40px;border-radius:50%;border:0;display:flex;align-items:center;justify-content:center;color:#E7E9EA;flex:none" style-hover="background:rgba(142,205,255,.10)"><svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"></path></svg></a>
      </sc-if>
      <sc-if value="{{ hasGithub }}" hint-placeholder-val="{{ true }}">
        <a href="{{ githubUrl }}" target="_blank" rel="noopener noreferrer" title="Open on GitHub" aria-label="Open on GitHub" class="glass" style="width:40px;height:40px;border-radius:50%;border:0;display:flex;align-items:center;justify-content:center;color:#E7E9EA;flex:none" style-hover="background:rgba(142,205,255,.10)"><svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12"></path></svg></a>
      </sc-if>
      <a href="/deploy" style="display:inline-flex;align-items:center;height:40px;padding:0 20px;border-radius:9999px;background:#EFF3F4;color:#0F1419;font-size:14px;font-weight:700;text-decoration:none;white-space:nowrap;flex:none;box-shadow:0 0 24px rgba(142,205,255,.25)" style-hover="background:#fff;text-decoration:none">Launch Coin</a>
    </div>
  </div>

    <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding-bottom:56px;min-height:0">
      <img src="/logo-glass.png" alt="" style="width:clamp(80px,20vh,200px);height:clamp(80px,20vh,200px);object-fit:contain;flex:none;animation:rise .7s ease both,breathe 5s ease-in-out infinite">
      <h1 style="margin:clamp(8px,2vh,20px) 0 0;font-size:clamp(34px,min(7.5vw,9vh),92px);font-weight:800;letter-spacing:-3px;line-height:.98;animation:rise .7s .05s ease both;text-shadow:0 0 40px rgba(142,205,255,.18)">Launch coins<br>with <span style="color:#8ECDFF">X Money</span></h1>
      <p style="margin:clamp(10px,2.4vh,22px) 0 0;font-size:clamp(15px,2.2vh,19px);color:#8B98A5;max-width:460px;text-wrap:pretty;line-height:1.45;animation:rise .7s .1s ease both">Send {{ launchFee }} with your coin's config in the note. Live in seconds. No forms, no wallets.</p>
      <div style="display:flex;gap:10px;margin-top:clamp(16px,3.6vh,34px);animation:rise .7s .15s ease both">
        <a href="/deploy" style="display:inline-flex;align-items:center;height:50px;padding:0 28px;border-radius:9999px;background:#EFF3F4;color:#0F1419;font-size:16px;font-weight:700;text-decoration:none;white-space:nowrap;flex:none;box-shadow:0 0 30px rgba(142,205,255,.3)" style-hover="background:#fff;text-decoration:none">Deploy Now</a>
        <a href="/explore" class="glass" style="display:inline-flex;align-items:center;height:50px;padding:0 28px;border-radius:9999px;border:0;color:#E7E9EA;font-size:16px;font-weight:700;text-decoration:none;white-space:nowrap;flex:none;box-shadow:inset 0 1px 0 rgba(255,255,255,.14)" style-hover="background:rgba(142,205,255,.10);text-decoration:none">Explore</a>
      </div>
      <button onClick="{{ copyHandle }}" title="{{ handleTitle }}" class="glass" style="display:flex;flex:none;align-items:center;gap:12px;height:48px;padding:0 20px 0 10px;margin-top:clamp(10px,2.4vh,22px);border-radius:9999px;border:0;color:#E7E9EA;cursor:pointer;animation:rise .7s .2s ease both" style-hover="background:rgba(142,205,255,.10)">
        <img src="/logo-glass.png" alt="" style="width:30px;height:30px;object-fit:contain">
        <span style="font-size:15px;font-weight:800;font-family:ui-monospace,SFMono-Regular,Menlo,monospace">{{ receiverHandle }}</span>
        <span style="font-size:13px;font-weight:700;color:{{ copyFg }}">{{ copyLabel }}</span>
      </button>
    </div>

    <div style="position:absolute;left:28px;right:28px;bottom:0;height:56px;display:flex;align-items:center;justify-content:space-between;border-top:1px solid rgba(142,205,255,.28);font-size:13px;font-weight:700;color:#8B98A5">
      <span>XLaunch · Built on X Money</span>
      <div style="display:flex;gap:20px"><a href="/how-it-works" style="color:#8B98A5" style-hover="color:#E7E9EA">Docs</a><a href="#" style="color:#8B98A5" style-hover="color:#E7E9EA">Terms</a></div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="">
// Live component logic is injected from frontend-api/ by the Rust server.
</script>
</body>
</html>
